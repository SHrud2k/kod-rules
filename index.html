<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Правила проекта — Kill OR Die DayZ | RP</title>
<style>
  :root {
    /* Discord dark theme palette */
    --bg: #313338;          /* chat background */
    --panel: #2b2d31;       /* embeds / channel list */
    --panel-2: #383a40;     /* hover */
    --text: #dbdee1;
    --heading: #f2f3f5;
    --muted: #949ba4;
    --accent: #5865f2;      /* blurple */
    --accent-deep: #4752c4; /* blurple pressed */
    --accent-text: #949cf7; /* brand text on dark */
    --link: #00a8fc;
    --border: #3f4147;
    --sidebar-w: 280px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 24px; }
  body {
    font-family: "gg sans", "Segoe UI", "Noto Sans", Arial, sans-serif;
    color: var(--text);
    line-height: 1.55;
    margin: 0;
    display: flex;
    background: var(--bg);
  }
  .page {
    flex: 1;
    min-width: 0;
    margin: 0;
    padding: 32px 48px 80px;
  }
  /* ---------- sidebar (built by JS) ---------- */
  aside.sidenav {
    position: sticky;
    top: 0;
    align-self: flex-start;
    flex: 0 0 var(--sidebar-w);
    width: var(--sidebar-w);
    height: 100vh;
    overflow-y: auto;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 20px 14px 30px;
    scrollbar-width: thin;
  }
  aside.sidenav .side-title {
    color: var(--heading);
    font-weight: 600;
    font-size: 15px;
    padding: 2px 10px 10px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 10px;
  }
  .nav-controls { display: flex; gap: 6px; padding: 0 6px 12px; }
  .nav-controls button {
    flex: 1;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 3px;
    padding: 6px 6px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
  }
  .nav-controls button:hover { background: var(--accent-deep); }
  .nav-controls button.secondary { background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); }
  .nav-controls button.secondary:hover { color: var(--text); border-color: var(--accent); background: var(--panel-2); }
  aside.sidenav nav a {
    display: block;
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    padding: 5px 10px;
    border-radius: 6px;
    border-left: 2px solid transparent;
  }
  aside.sidenav nav a:hover { color: var(--text); background: var(--panel-2); }
  aside.sidenav nav a.active {
    color: var(--heading);
    background: #404249;
    border-left-color: var(--accent);
  }
  @media (max-width: 1050px) { aside.sidenav { display: none; } }
  /* ---------- header & top toc ---------- */
  header.title {
    text-align: center;
    border-bottom: 3px solid var(--accent);
    padding-bottom: 20px;
    margin-bottom: 28px;
  }
  header.title h1 { margin: 0 0 6px; font-size: 30px; color: var(--heading); }
  header.title .sub { color: var(--muted); font-size: 14px; }
  nav.toc {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px 22px 22px;
    margin-bottom: 36px;
  }
  nav.toc h2 { margin: 0 0 14px; font-size: 16px; color: var(--heading); }
  nav.toc .toc-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 12px;
  }
  nav.toc .toc-group {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 6px;
    padding: 10px 14px;
  }
  nav.toc .toc-group b {
    display: block;
    color: var(--heading);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-bottom: 6px;
  }
  nav.toc a { display: block; color: var(--link); text-decoration: none; padding: 2px 0; font-size: 14px; }
  nav.toc a:hover { text-decoration: underline; }
  /* ---------- collapsible sections ---------- */
  h2.section {
    display: flex;
    justify-content: flex-start;
    align-items: center;
    gap: 12px;
    color: var(--heading);
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 20px;
    margin: 26px 0 0;
    cursor: pointer;
    user-select: none;
  }
  h2.section:hover { background: var(--panel-2); }
  h2.section::after {
    content: "▾";
    color: var(--heading);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 28px;
    height: 28px;
    line-height: 26px;
    text-align: center;
    font-size: 15px;
    flex: 0 0 28px;
    margin-left: auto;
    transition: transform .15s ease;
  }
  /* ---------- recently changed ---------- */
  .rule.updated { border-left-color: #f0b232; }
  .badge-upd, .badge-new {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .4px;
    border-radius: 4px;
    padding: 1px 7px;
    margin-left: 8px;
    vertical-align: 2px;
    white-space: nowrap;
  }
  .badge-upd { background: #f0b232; color: #1a1a1a; }
  .badge-new { background: #23a55a; color: #fff; }
  .upd-count {
    background: #f0b232;
    color: #1a1a1a;
    font-size: 12px;
    font-weight: 700;
    border-radius: 10px;
    padding: 1px 10px;
    white-space: nowrap;
    text-decoration: none;
    cursor: pointer;
  }
  .upd-count:hover { background: #ffc94d; }
  aside.sidenav nav a .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #f0b232;
    margin-left: 6px;
    vertical-align: 1px;
  }
  .changelog-list { margin: 6px 0; padding-left: 22px; }
  @media print { .badge-upd, .badge-new, .upd-count { display: none; } }
  h2.section.collapsed::after { transform: rotate(-90deg); }
  .section-body { padding-top: 4px; margin-bottom: 10px; }
  h3 {
    color: var(--heading);
    border-bottom: 2px solid var(--border);
    padding-bottom: 4px;
    margin: 30px 0 12px;
    font-size: 17px;
  }
  /* ---------- cards ---------- */
  .rule {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    border-radius: 0 6px 6px 0;
    padding: 12px 18px;
    margin: 10px 0 10px 22px;
    line-height: 1.62;
    font-size: 15px;
  }
  /* sub-points (1.2.14.1, 4.3.1, …) sit one level deeper than their parent */
  .rule.lvl1 { margin-left: 50px; }
  .rule.lvl2 { margin-left: 78px; border-left-color: var(--accent-deep); }
  .section-body > .note { margin-left: 22px; }
  .section-body > h3 { margin-left: 22px; }
  .rule b.num { color: var(--accent-text); }
  .rule a, .note a { color: var(--link); text-decoration: none; }
  .rule a:hover, .note a:hover { text-decoration: underline; }
  a.rref { color: var(--accent-text); text-decoration: underline dotted; text-underline-offset: 3px; }
  a.rref:hover { color: var(--heading); text-decoration: underline; }
  .rule:target { border-left-color: var(--accent-text); box-shadow: 0 0 0 1px var(--accent-deep); }
  .rule p { margin: 6px 0; }
  .rule ul { margin: 6px 0; padding-left: 22px; }
  .note {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 4px solid #f0b232;
    border-radius: 0 6px 6px 0;
    padding: 10px 16px;
    margin: 10px 0;
  }
  .example { color: var(--muted); font-style: italic; }
  .rule table { border-collapse: collapse; width: 100%; margin: 10px 0 6px; }
  .rule th, .rule td { border: 1px solid var(--border); padding: 6px 12px; text-align: left; font-size: 14px; }
  .rule th { background: var(--panel-2); color: var(--heading); }
  .rule td.hl { color: #f0b232; font-weight: 600; }
  .rule::after { content: ""; display: block; clear: both; }
  .chevron {
    float: right;
    margin: 4px 0 10px 16px;
    text-align: center;
  }
  .chevron img {
    display: block;
    height: 220px;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  .section-body::after { content: ""; display: block; clear: both; }
  /* ---------- print (light theme, everything expanded) ---------- */
  @media print {
    body { display: block; background: #fff; color: #1a1a1a; }
    aside.sidenav { display: none !important; }
    .page { padding: 0; max-width: none; font-size: 11pt; }
    header.title h1, nav.toc h2, h3, .rule b.num { color: #4752c4; }
    nav.toc { background: #f6f8f6; border-color: #d8ded8; columns: 2; }
    nav.toc a, a { color: #1a1a1a; }
    h2.section {
      color: #fff; background: #5865f2; border: none; cursor: auto;
      page-break-after: avoid; break-after: avoid;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    h2.section::after { content: ""; }
    .section-body { display: block !important; }
    h3 { page-break-after: avoid; border-color: #d8ded8; }
    .rule, .note {
      page-break-inside: avoid;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    .rule { background: #f6f8f6; border-color: #d8ded8; border-left-color: #5865f2; }
    .note { background: #fff8e6; border-color: #e8d9a8; border-left-color: #d4a017; }
    .example { color: #666; }
    .pb { page-break-before: always; }
  }
</style>
</head>
<body>
<noscript><div style="padding:40px;color:#f23f43;font-family:sans-serif">Для просмотра правил включите JavaScript.</div></noscript>
<script>
(function () {
  // ======================================================================
  // All page text lives in data/*.json (rules.json, changelog.json,
  // meta.json). This script only renders it and adds the interactions.
  // ======================================================================
  var latestModified = null;

  function fetchJson(url) {
    return fetch(url, { cache: "no-cache" }).then(function (r) {
      if (!r.ok) throw new Error(url + " → HTTP " + r.status);
      var lm = r.headers.get("last-modified");
      if (lm) {
        var d = new Date(lm);
        if (!isNaN(d) && (!latestModified || d > latestModified)) latestModified = d;
      }
      return r.json();
    });
  }

  function render(meta, rules, changelog) {
    // Every rule number mentioned in a text becomes a link to that rule.
    var numSet = {};
    rules.sections.forEach(function (sec) {
      sec.content.forEach(function (c) { if (c.num) numSet[c.num] = true; });
    });
    function linkifyRefs(html, selfNum) {
      var PLACEHOLDER = "@@NUMLEAD@@";
      var lead = '<b class="num">' + selfNum + "</b>";
      var hasLead = selfNum && html.indexOf(lead) !== -1;
      if (hasLead) html = html.replace(lead, PLACEHOLDER);
      html = html.replace(/\d+(?:\.\d+)+/g, function (m, off) {
        var prev = html.charAt(off - 1);
        var next = html.charAt(off + m.length);
        if (prev && /[\d."'=#-]/.test(prev)) return m;
        if (next === "." && /\d/.test(html.charAt(off + m.length + 1))) return m;
        if (!numSet[m] || m === selfNum) return m;
        return '<a class="rref" href="#r' + m.replace(/\./g, "-") + '">' + m + "</a>";
      });
      if (hasLead) html = html.replace(PLACEHOLDER, lead);
      return html;
    }

    var out = [];
    out.push('<header class="title"><h1>' + meta.title + '</h1><div class="sub">' +
      meta.project + ' &nbsp;·&nbsp; ' + meta.updatedLabel + ': <span id="last-updated">' +
      meta.fallbackUpdated + '</span></div></header>');

    out.push('<nav class="toc"><h2>' + meta.tocTitle + '</h2><div class="toc-grid">');
    rules.tocGroups.forEach(function (g) {
      out.push('<div class="toc-group"><b>' + g.title + '</b>');
      g.links.forEach(function (l) { out.push('<a href="#' + l.id + '">' + l.text + '</a>'); });
      out.push('</div>');
    });
    out.push('</div></nav>');

    out.push('<h2 class="section" id="slog">' + changelog.sectionTitle + '</h2>');
    changelog.entries.forEach(function (en, i) {
      out.push('<div class="rule"><p><b class="num">' + en.date + '</b></p><ul class="changelog-list">');
      en.items.forEach(function (it) { out.push('<li>' + it + '</li>'); });
      out.push('</ul>');
      if (i === 0 && changelog.fullListLink) {
        out.push('<p><a href="' + changelog.fullListLink.href + '">' + changelog.fullListLink.text + '</a></p>');
      }
      out.push('</div>');
    });

    rules.sections.forEach(function (sec) {
      out.push('<h2 class="section' + (sec.pageBreak ? ' pb' : '') + '" id="' + sec.id + '">' + sec.title + '</h2>');
      sec.content.forEach(function (c) {
        if (c.type === 'h3') out.push('<h3>' + c.text + '</h3>');
        else if (c.type === 'note') out.push('<div class="note">' + linkifyRefs(c.html, null) + '</div>');
        else out.push('<div class="rule"' +
          (c.num ? ' id="r' + c.num.replace(/\./g, '-') + '"' : '') +
          (c.updated ? ' data-updated="' + c.updated + '"' : '') +
          '>' + linkifyRefs(c.html, c.num || null) + '</div>');
      });
    });

    document.body.innerHTML = out.join('\n');
  }

  function initPage(meta) {
    // "Last updated" — the freshest Last-Modified among the data files
    // (deploy time on GitHub Pages); meta.fallbackUpdated otherwise.
    var mod = latestModified || new Date(document.lastModified);
    if (mod && !isNaN(mod)) {
      var dd = String(mod.getDate()).padStart(2, "0");
      var mm = String(mod.getMonth() + 1).padStart(2, "0");
      document.getElementById("last-updated").textContent = dd + "." + mm + "." + mod.getFullYear();
    }

    // Wrap content into .page and add the sidebar.
    var page = document.createElement("div");
    page.className = "page";
    while (document.body.firstChild) page.appendChild(document.body.firstChild);
    var aside = document.createElement("aside");
    aside.className = "sidenav";
    document.body.appendChild(aside);
    document.body.appendChild(page);

    // Group each section's content into a collapsible .section-body.
    var sections = Array.prototype.slice.call(page.querySelectorAll("h2.section"));
    sections.forEach(function (h2) {
      var body = document.createElement("div");
      body.className = "section-body";
      var n = h2.nextSibling;
      while (n && !(n.nodeType === 1 && n.matches && n.matches("h2.section"))) {
        var next = n.nextSibling;
        body.appendChild(n);
        n = next;
      }
      h2.parentNode.insertBefore(body, h2.nextSibling);
      h2.addEventListener("click", function () { setOpen(h2, h2.classList.contains("collapsed")); });

      // Indent sub-points one level deeper than the shallowest rule number
      // in the section (e.g. 1.2.14.1 under 1.2.14, 4.3.1 under 4.3).
      var rulesEls = Array.prototype.slice.call(body.querySelectorAll(".rule"));
      var depths = rulesEls.map(function (r) {
        var num = r.querySelector("b.num");
        return num ? num.textContent.trim().replace(/\.$/, "").split(".").length : 0;
      });
      var withNum = depths.filter(function (d) { return d > 0; });
      if (withNum.length) {
        var base = Math.min.apply(null, withNum);
        rulesEls.forEach(function (r, i) {
          if (depths[i] > base) r.classList.add(depths[i] - base >= 2 ? "lvl2" : "lvl1");
        });
      }
    });

    function setOpen(h2, open) {
      h2.classList.toggle("collapsed", !open);
      var body = h2.nextElementSibling;
      if (body && body.classList.contains("section-body")) body.style.display = open ? "" : "none";
    }

    // Collapsed by default — the page is long; TOC / sidebar links auto-expand.
    sections.forEach(function (h2) { setOpen(h2, false); });

    // ----- "recently changed" highlighting -----
    var HIGHLIGHT_DAYS = 7;
    var updatedSections = {};
    (function () {
      var now = new Date();
      var baseline = "", readAtStr = "";
      try {
        baseline = sessionStorage.getItem("rulesVisitBaseline");
        if (baseline === null) {
          baseline = localStorage.getItem("rulesLastVisit") || "";
          sessionStorage.setItem("rulesVisitBaseline", baseline);
        }
        localStorage.setItem("rulesLastVisit", now.toISOString());
        readAtStr = localStorage.getItem("rulesReadAt") || "";
      } catch (e) { baseline = ""; }
      var lastVisit = baseline ? new Date(baseline) : null;
      // compare by day: updates are dated at midnight, so a same-day visit
      // must not hide them
      var baselineDay = lastVisit && !isNaN(lastVisit)
        ? new Date(lastVisit.getFullYear(), lastVisit.getMonth(), lastVisit.getDate())
        : null;
      var readAt = readAtStr ? new Date(readAtStr) : null;

      Array.prototype.slice.call(page.querySelectorAll("[data-updated]")).forEach(function (el) {
        var d = new Date(el.getAttribute("data-updated") + "T00:00:00");
        if (isNaN(d)) return;
        if (readAt && !isNaN(readAt) && d <= readAt) return; // dismissed via "mark as read"
        var recent = (now - d) / 86400000 <= HIGHLIGHT_DAYS;
        var isNew = baselineDay && d >= baselineDay;
        if (!recent && !isNew) return;
        el.classList.add("updated");
        var badge = document.createElement("span");
        if (isNew) {
          badge.className = "badge-new";
          badge.textContent = "NEW";
        } else {
          badge.className = "badge-upd";
          badge.textContent = "ОБНОВЛЕНО " + ("0" + d.getDate()).slice(-2) + "." + ("0" + (d.getMonth() + 1)).slice(-2);
        }
        var num = el.querySelector("b.num");
        if (num) num.insertAdjacentElement("afterend", badge);
        else el.insertBefore(badge, el.firstChild);
        var body = el.closest(".section-body");
        var h2sec = body && body.previousElementSibling;
        if (h2sec && h2sec.id) updatedSections[h2sec.id] = (updatedSections[h2sec.id] || 0) + 1;
      });
    })();

    // Sidebar: title, expand/collapse-all controls, section links.
    aside.innerHTML =
      '<div class="side-title">' + meta.sidebarTitle + '</div>' +
      '<div class="nav-controls">' +
      '<button type="button" id="expand-all">' + meta.expandAll + '</button>' +
      '<button type="button" id="collapse-all">' + meta.collapseAll + '</button>' +
      "</div>";
    var nav = document.createElement("nav");
    aside.appendChild(nav);
    sections.forEach(function (h2) {
      var a = document.createElement("a");
      a.href = "#" + h2.id;
      a.textContent = h2.textContent;
      if (updatedSections[h2.id]) {
        var dot = document.createElement("span");
        dot.className = "dot";
        dot.title = "Есть недавние изменения";
        a.appendChild(dot);
      }
      nav.appendChild(a);
    });
    document.getElementById("expand-all").addEventListener("click", function () {
      sections.forEach(function (h2) { setOpen(h2, true); });
    });
    document.getElementById("collapse-all").addEventListener("click", function () {
      sections.forEach(function (h2) { setOpen(h2, false); });
    });

    // Section headers show how many rules inside were recently changed;
    // the chip links to the before/after page for that section.
    Object.keys(updatedSections).forEach(function (id) {
      var h2sec = document.getElementById(id);
      if (!h2sec) return;
      var chip = document.createElement("a");
      chip.className = "upd-count";
      chip.textContent = updatedSections[id] + " обнов.";
      chip.href = "changes.html#chg-" + id;
      chip.title = "Показать изменения: до и после";
      chip.addEventListener("click", function (e) { e.stopPropagation(); });
      h2sec.appendChild(chip);
    });

    // "Mark all as read": hides every change marker and remembers it per browser.
    if (Object.keys(updatedSections).length) {
      var mr = document.createElement("div");
      mr.className = "nav-controls";
      mr.innerHTML = '<button type="button" id="mark-read" class="secondary" title="Скрыть отметки об изменениях">Отметить всё прочитанным</button>';
      var controls = aside.querySelector(".nav-controls");
      controls.parentNode.insertBefore(mr, controls.nextSibling);
      mr.querySelector("button").addEventListener("click", function () {
        try { localStorage.setItem("rulesReadAt", new Date().toISOString()); } catch (e) {}
        Array.prototype.slice.call(document.querySelectorAll(".badge-upd, .badge-new, .upd-count, aside.sidenav .dot")).forEach(function (x) { x.parentNode.removeChild(x); });
        Array.prototype.slice.call(document.querySelectorAll(".rule.updated")).forEach(function (x) { x.classList.remove("updated"); });
        mr.parentNode.removeChild(mr);
      });
    }

    // Any in-page anchor click (TOC, sidebar, cross-references) expands its
    // target — a section, or the section containing a referenced rule.
    function revealTarget(target) {
      if (!target) return false;
      if (target.classList.contains("section")) { setOpen(target, true); return true; }
      var body = target.closest(".section-body");
      if (body && body.previousElementSibling) {
        setOpen(body.previousElementSibling, true);
        return true;
      }
      return false;
    }
    document.addEventListener("click", function (e) {
      var a = e.target.closest ? e.target.closest('a[href^="#"]') : null;
      if (!a) return;
      revealTarget(document.getElementById(decodeURIComponent(a.getAttribute("href").slice(1))));
    });

    // Highlight the section currently in view.
    if ("IntersectionObserver" in window) {
      var links = nav.querySelectorAll("a");
      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          links.forEach(function (l) { l.classList.remove("active"); });
          var link = nav.querySelector('a[href="#' + entry.target.id + '"]');
          if (link) link.classList.add("active");
        });
      }, { rootMargin: "0px 0px -60% 0px" });
      sections.forEach(function (h2) { observer.observe(h2); });
    }

    // Opening the page with #section or #rule in the URL expands and scrolls to it.
    function openFromHash() {
      if (!location.hash) return;
      var target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
      if (revealTarget(target)) target.scrollIntoView();
    }
    openFromHash();
    window.addEventListener("hashchange", openFromHash);

    // Printing always gets the full document.
    window.addEventListener("beforeprint", function () {
      sections.forEach(function (h2) { setOpen(h2, true); });
    });
  }

  document.addEventListener("DOMContentLoaded", function () {
    Promise.all([
      fetchJson("data/meta.json"),
      fetchJson("data/rules.json"),
      fetchJson("data/changelog.json")
    ]).then(function (res) {
      render(res[0], res[1], res[2]);
      initPage(res[0]);
    }).catch(function (e) {
      document.body.innerHTML = '<div style="padding:40px;font-family:sans-serif;color:#f23f43">' +
        'Не удалось загрузить данные правил (' + e.message + '). ' +
        'Страница должна открываться через веб-сервер, а не как локальный файл.</div>';
    });
  });
})();
</script>
</body>
</html>
